name: Sentinel validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: sentinel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://sentinel:ci-synthetic-only@localhost:5432/sentinel_test
      REDIS_URL: redis://localhost:6379/0
      CORS_ORIGINS: http://localhost:5173
      SENTINEL_TEST_USERS: /tmp/platform-users.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - name: Apply frozen migrations on PostgreSQL
        working-directory: backend
        run: alembic upgrade head
      - run: python -m pytest backend/tests -q
      - name: Provision all three synthetic CI roles without default passwords
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os
          from pathlib import Path
          import secrets
          from scripts.create_user import provision
          records = {}
          for role in ('ADMIN', 'ANALYST', 'VIEWER'):
              username, password = 'ci-' + role.lower(), secrets.token_urlsafe(28)
              asyncio.run(provision(username, role, password))
              records[role] = {'username': username, 'password': password}
          path = Path(os.environ['SENTINEL_TEST_USERS'])
          path.touch(mode=0o600)
          path.write_text(json.dumps(records))
          PY
      - name: Start real API and worker
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/sentinel-api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/sentinel-api.log
          exit 1
      - name: Exercise cross-domain persisted HTTP and WebSocket flows
        run: python scripts/platform_smoke.py --credentials "$SENTINEL_TEST_USERS" --output .runtime/ci-platform-smoke.json
      - name: Measure real replay persistence and alert latency
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          admin = json.loads(Path(os.environ['SENTINEL_TEST_USERS']).read_text())['ADMIN']
          env = {**os.environ, 'SENTINEL_USERNAME': admin['username'], 'SENTINEL_PASSWORD': admin['password']}
          subprocess.run(['python', 'scripts/benchmark.py', '--runs', '2', '--output', 'benchmark.json'], env=env, check=True)
          PY
      - name: Install and build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install Chromium with official Playwright dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start frontend against the real API
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/sentinel-web.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail http://localhost:5173; then exit 0; fi
            sleep 1
          done
          cat /tmp/sentinel-web.log
          exit 1
      - name: Run all three browser E2E tests with provisioned role fixtures
        working-directory: frontend
        run: |
          test -f "$SENTINEL_TEST_USERS"
          npm run test:e2e
      - name: Validate Docker image builds
        run: |
          docker build --tag sentinel-api:ci ./backend
          docker build --tag sentinel-frontend:ci ./frontend
      - name: Upload actual measurements and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: |
            benchmark.json
            .runtime/ci-platform-smoke.json
            .runtime/e2e-*-trades.csv
            frontend/test-results/
            frontend/playwright-report/
            /tmp/sentinel-api.log
            /tmp/sentinel-web.log
      - name: Remove ephemeral CI credential fixture
        if: always()
        run: rm -f "$SENTINEL_TEST_USERS"
